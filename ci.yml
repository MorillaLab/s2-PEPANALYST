name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install core dependencies
      run: |
        python -m pip install --upgrade pip
        # Install lighter subset for CI (skip large LM downloads)
        pip install numpy pandas scipy scikit-learn matplotlib biopython flake8 pytest
        pip install giotto-tda gudhi

    - name: Lint with flake8
      run: |
        # Check for syntax errors and undefined names
        flake8 code/ --count --select=E9,F63,F7,F82 --show-source --statistics 2>/dev/null || \
          echo "No .py files to lint in code/"
        flake8 code/ --count --max-line-length=127 --statistics 2>/dev/null || true

    - name: Check imports
      run: |
        python -c "import numpy, pandas, scipy, sklearn, Bio; print('Core imports OK')"

    - name: Run tests (if present)
      run: |
        pytest code/tests/ -v --tb=short 2>/dev/null || echo "No tests found — skipping"
      continue-on-error: true
